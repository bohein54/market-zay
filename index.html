<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <!-- Favicon Logo (Browser တက်ဘ်မှာပေါ်မည့် Logo) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%232563eb'/><text x='50' y='65' font-size='45' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>💱</text></svg>">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 25px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        /* App Logo ပုံစံ */
        .app-logo-container {
            text-align: center;
            margin-bottom: 12px;
        }
        .app-logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #2563eb, #1e40af);
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        .app-logo svg {
            width: 36px;
            height: 36px;
            fill: white;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 6px;
            font-size: 20px;
        }
        .live-status {
            text-align: center;
            font-size: 12px;
            color: #16a34a;
            margin-bottom: 15px;
            font-weight: 600;
            background: #f0fdf4;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #bbf7d0;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #334155;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            background-color: #fff;
            transition: border-color 0.2s;
        }
        input:focus, select:focus {
            border-color: #3b82f6;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #eff6ff;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #bfdbfe;
        }
        .result-title {
            font-size: 13px;
            color: #1e40af;
            font-weight: 600;
        }
        .result-value {
            font-size: 22px;
            font-weight: bold;
            color: #1e3a8a;
            margin-top: 6px;
            word-break: break-all;
        }
        .rate-settings {
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #e2e8f0;
        }
        .rate-toggle {
            font-size: 13px;
            color: #2563eb;
            cursor: pointer;
            text-align: right;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="card">
    <!-- App Logo Icon ထည့်သွင်းထားသော နေရာ -->
    <div class="app-logo-container">
        <div class="app-logo">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-13.86c-1.22-.39-2.12-.91-2.7-1.57-.59-.66-.88-1.51-.88-2.55 0-1.2.49-2.23 1.48-3.1 1-.87 2.3-1.38 3.9-1.53V1h2v1.31c1.33.15 2.37.58 3.12 1.28.75.7 1.13 1.58 1.13 2.64 0 1.05-.33 1.94-.99 2.68-.66.74-1.61 1.3-2.84 1.68l-1.24.41c-1.39.46-2.4 1.01-3.04 1.65-.64.64-.96 1.45-.96 2.43 0 .97.38 1.77 1.14 2.4 0.76.63 1.8 0.98 3.12 1.06V21h-2v-1.3c-1.42-.15-2.53-.59-3.33-1.32-.8-.73-1.2-1.69-1.2-2.88 0-1.12.39-2.07 1.17-2.85.78-.78 1.85-1.37 3.21-1.77l1.23-.42c1.37-.46 2.34-.99 2.91-1.6.57-.61.85-1.39.85-2.33 0-.91-.35-1.68-1.04-2.31-.69-.63-1.65-.99-2.88-1.08V3.53z"/>
            </svg>
        </div>
    </div>

    <h2>💱 ငွေလဲလှယ်ရေး </h2>
    
    <!-- Live နှုန်းထားများ တိုက်ရိုက်ပြမည့်နေရာ -->
    <div class="live-status" id="liveStatus">
         🌐 Today ဗဟိုဘဏ်ပေါက်စျေးကို ချိတ်ဆက်ပေးနေပါသည်...
    </div>

    <!-- ပေါက်ဈေးများ (Live ဖြင့် အလိုအလျောက် ဖြည့်ပေးမည်) -->
    <div class="rate-toggle" onclick="toggleRates()">⚙️ ဈေးနှုန်းများ စစ်ဆေးရန်/ပြင်ရန်</div>
    <div id="rateSection" class="rate-settings hidden">
        <div class="form-group" style="margin-bottom: 8px;">
            <label>1 USD ➔ THB (Live Rate)</label>
            <input type="number" id="usdThbRate" value="35" step="0.01" oninput="calculate()">
        </div>
        <div class="form-group" style="margin-bottom: 8px;">
            <label>1 USD ➔ MMK (Live Rate)</label>
            <input type="number" id="usdMmkRate" value="2100" step="1" oninput="calculate()">
        </div>
        <div class="form-group" style="margin-bottom: 0;">
            <label>၁ ဘတ် ➔ ကျပ် (တွက်ချက်မှုနှုန်း)</label>
            <input type="number" id="thbMmkCustom" value="120" step="0.1" oninput="calculate()">
        </div>
    </div>

    <!-- ငွေကြေး အမျိုးအစား ရွေးချယ်ရန် -->
    <div class="form-group">
        <label for="currencyType">တွက်ချက်မည့် ငွေကြေးအမျိုးအစား</label>
        <select id="currencyType" onchange="changeCurrencyType()">
            <option value="thb">฿ 🇹🇭 ထိုင်းဘတ် ➔ မြန်မာကျပ် (THB to MMK)</option>
            <option value="mmk">💰 MMK မြန်မာကျပ် ➔ ထိုင်းဘတ် (MMK to THB)</option>
            <option value="usdToThb">💵 USD ➔ ထိုင်းဘတ် (USD to THB)</option>
            <option value="usdToMmk">💵 USD ➔ မြန်မာကျပ် (USD to MMK)</option>
        </select>
    </div>

    <!-- ပမာဏ ထည့်ရန် အကွက် -->
    <div class="form-group">
        <label id="inputLabel" for="amountInput">ထိုင်းဘတ်ငွေ (THB)</label>
        <input type="number" id="amountInput" placeholder="ပမာဏထည့်ပါ" value="100" oninput="calculate()">
    </div>

    <!-- ရလဒ်ပြကွက် -->
    <div class="result-box">
        <div class="result-title" id="resultTitle">ရရှိမည့် မြန်မာကျပ်ငွေ</div>
        <div class="result-value" id="resultValue">0 MMK</div>
    </div>
</div>

<script>
    async function fetchLiveRates() {
        try {
            const response = await fetch('https://open.er-api.com/v6/latest/USD');
            const data = await response.json();
            
            if (data && data.rates) {
                let usdThb = data.rates.THB || 35;
                let usdMmk = data.rates.MMK || 2100;
                let thbMmk = usdMmk / usdThb;

                document.getElementById('usdThbRate').value = usdThb.toFixed(2);
                document.getElementById('usdMmkRate').value = usdMmk.toFixed(2);
                document.getElementById('thbMmkCustom').value = thbMmk.toFixed(2);

                document.getElementById('liveStatus').innerHTML = `
                    🟢 <b> Today ဗဟိုဘဏ်ပေါက်စျေး </b><br>
                    1 USD = <b>${usdThb.toFixed(2)} THB</b> | 1 THB = <b>${thbMmk.toFixed(2)} MMK</b><br>
                    1 USD = <b>${usdMmk.toLocaleString('en-US', {maximumFractionDigits: 0})} MMK</b>
                `;
                calculate();
            }
        } catch (error) {
            document.getElementById('liveStatus').innerText = "⚠️ Today ဗဟိုဘဏ်ပေါက်စျေးကိုမရနိုင်ပါ (ပုံသေ သတ်မှတ်ဈေးကို သုံးနေပါသည်)";
            document.getElementById('liveStatus').style.color = "#dc2626";
            calculate();
        }
    }

    function toggleRates() {
        const rateSection = document.getElementById('rateSection');
        rateSection.classList.toggle('hidden');
    }

    function changeCurrencyType() {
        const type = document.getElementById('currencyType').value;
        const inputLabel = document.getElementById('inputLabel');
        
        if (type === 'thb') {
            inputLabel.innerText = "ထိုင်းဘတ်ငွေ (THB)";
        } else if (type === 'mmk') {
            inputLabel.innerText = "မြန်မာကျပ်ငွေ (MMK)";
        } else if (type === 'usdToThb' || type === 'usdToMmk') {
            inputLabel.innerText = "အမေရိကန်ဒေါ်လာ (USD)";
        }
        calculate();
    }

    function calculate() {
        const type = document.getElementById('currencyType').value;
        const amount = parseFloat(document.getElementById('amountInput').value) || 0;
        
        const usdThbRate = parseFloat(document.getElementById('usdThbRate').value) || 1;
        const usdMmkRate = parseFloat(document.getElementById('usdMmkRate').value) || 1;
        const thbMmkCustom = parseFloat(document.getElementById('thbMmkCustom').value) || 0;

        const resultTitle = document.getElementById('resultTitle');
        const resultValue = document.getElementById('resultValue');

        if (type === 'thb') {
            let totalMmk = amount * thbMmkCustom;
            resultTitle.innerText = "ရရှိမည့် မြန်မာကျပ်ငွေ";
            resultValue.innerText = totalMmk.toLocaleString('en-US', {maximumFractionDigits: 2}) + " MMK";
        } 
        else if (type === 'mmk') {
            let totalThb = thbMmkCustom > 0 ? amount / thbMmkCustom : 0;
            resultTitle.innerText = "ရရှိမည့် ထိုင်းဘတ်ငွေ";
            resultValue.innerText = totalThb.toLocaleString('en-US', {maximumFractionDigits: 2}) + " THB";
        } 
        else if (type === 'usdToThb') {
            let totalThb = amount * usdThbRate;
            resultTitle.innerText = "ရရှိမည့် ထိုင်းဘတ်ငွေ (Live)";
            resultValue.innerText = totalThb.toLocaleString('en-US', {maximumFractionDigits: 2}) + " THB";
        }
        else if (type === 'usdToMmk') {
            let totalMmk = amount * usdMmkRate;
            resultTitle.innerText = "ရရှိမည့် မြန်မာကျပ်ငွေ (Live)";
            resultValue.innerText = totalMmk.toLocaleString('en-US', {maximumFractionDigits: 2}) + " MMK";
        }
    }

    window.onload = function() {
        fetchLiveRates();
    };
</script>

</body>
</html>
